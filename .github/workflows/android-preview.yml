name: Android preview APK
on:
  push:
    branches: [android-standalone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify shared app
        run: |
          npm ci --include=dev --ignore-scripts
          npm test
      - name: Build and check Android preview
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check learning, accessibility layouts and audio flows
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python scripts/check-interface-browser.py
          python scripts/check-learning-browser.py
          python scripts/check-player-browser.py
          python scripts/check-android-bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: Akhlaq-Android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
