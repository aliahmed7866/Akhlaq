plugins { id 'com.android.application' }
android {
    namespace 'uk.akhlaq.app'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.akhlaq.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.0.0-preview1'
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    buildTypes { debug { applicationIdSuffix '.preview' }; release { minifyEnabled false } }
    sourceSets.main.assets.srcDirs = ['build/generated/assets']
}
tasks.register('prepareWeb', Exec) {
    workingDir '../..'
    commandLine 'node', 'scripts/prepare-android.mjs'
    inputs.dir '../../public'
    inputs.dir '../../data'
    outputs.dir 'build/generated/assets'
}
preBuild.dependsOn prepareWeb
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'androidx.media3:media3-datasource:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
