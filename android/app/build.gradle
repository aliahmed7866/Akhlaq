plugins { id 'com.android.application' }
def releaseVersion = new Properties()
file('../version.properties').withInputStream { releaseVersion.load(it) }
def signingNames = ['AKHLAQ_KEYSTORE_PATH', 'AKHLAQ_KEYSTORE_PASSWORD', 'AKHLAQ_KEY_ALIAS', 'AKHLAQ_KEY_PASSWORD']
def signingValues = signingNames.collect { System.getenv(it) }
if (signingValues.any { it } && !signingValues.every { it }) {
    throw new GradleException('Release signing is incomplete. Set all four AKHLAQ signing environment variables.')
}
android {
    namespace 'uk.akhlaq.app'
    compileSdk 36
    defaultConfig {
        applicationId 'uk.akhlaq.app'
        minSdk 26
        targetSdk 36
        versionCode releaseVersion.getProperty('versionCode').toInteger()
        versionName releaseVersion.getProperty('versionName')
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        if (signingValues.every { it }) {
            upload {
                storeFile file(signingValues[0])
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release {
            debuggable false
            minifyEnabled false
            if (signingValues.every { it }) signingConfig signingConfigs.upload
        }
    }
    sourceSets.main.assets.srcDirs = ['build/generated/assets']
    sourceSets.main.res.srcDirs += ['build/generated/akhlaq-res']
}
tasks.register('prepareWeb', Exec) {
    workingDir '../..'
    commandLine 'node', 'scripts/prepare-android.mjs'
    inputs.dir '../../public'
    inputs.dir '../../data'
    inputs.file '../../scripts/prepare-android.mjs'
    inputs.file '../../urdu.mjs'
    outputs.dir 'build/generated/assets'
    outputs.dir 'build/generated/akhlaq-res'
}
preBuild.dependsOn prepareWeb
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'androidx.media3:media3-datasource:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20240303'
}
